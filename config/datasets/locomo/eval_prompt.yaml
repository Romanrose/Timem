# ============================================================================
# Locomo Dataset Configuration
# ============================================================================
# This configuration file provides evaluation prompts optimized for the Locomo experimental dataset
# ============================================================================

# TiMem Evaluation Prompt Configuration

# LLM Evaluation Model Configuration
# LLM model used for Locomo evaluation
eval_llm_config:
  provider: "mimo" # LLM provider
  model: "mimo-v2-omni" # Using mimo-v2-omni for evaluation
  temperature: 0.7 # Evaluation temperature set to 0.7
  max_tokens: 512 # Real prompts need extra room for Mimo reasoning tokens plus final JSON label

# Backward compatibility fields
eval_model: "mimo-v2-omni" # For backward compatibility with legacy code

# Question-answering evaluation prompt
qa_evaluation_prompt: |
  Your task is to label an answer to a question as 'CORRECT' or 'WRONG'. You will be given the following data:
      (1) a question (posed by one user to another user),
      (2) a 'gold' (ground truth) answer,
      (3) a generated answer
  which you will score as CORRECT/WRONG.

  The point of the question is to ask about something one user should know about the other user based on their prior conversations.
  The gold answer will usually be a concise and short answer that includes the referenced topic, for example:
  Question: Do you remember what I got the last time I went to Hawaii?
  Gold answer: A shell necklace
  The generated answer might be much longer, but you should be generous with your grading - as long as it touches on the same topic as the gold answer, it should be counted as CORRECT.

  For time related questions, the gold answer will be a specific date, month, year, etc. The generated answer might be much longer or use relative time references (like "last Tuesday" or "next month"), but you should be generous with your grading - as long as it refers to the same date or time period as the gold answer, it should be counted as CORRECT. Even if the format differs (e.g., "May 7th" vs "7 May"), consider it CORRECT if it's the same date.

  Now it's time for the real question:
  Question: {question}
  Gold answer: {standard_answer}
  Generated answer: {generated_answer}

  Return only a compact JSON object in exactly this format:
  {{"label":"CORRECT"}}
  or
  {{"label":"WRONG"}}

  Do not include explanations, markdown, or any text outside the JSON object.
